# Local development. Usage: docker compose up --build
x-database-url: &database-url postgresql://${POSTGRES_USER:-review_user}:${POSTGRES_PASSWORD:-review_pass}@postgres:5432/${POSTGRES_DB:-review_db}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-review_pass}
      POSTGRES_DB: ${POSTGRES_DB:-review_db}
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10

  migrate:
    build:
      context: ./api
      target: migrate
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: ./api
      target: runtime
    env_file: .env
    environment:
      DATABASE_URL: *database-url
    ports:
      - "3001:3001"
    volumes:
      - ./api/uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully

  web:
    build:
      context: ./web
      target: development
    environment:
      API_PROXY_TARGET: http://api:3001
    ports:
      - "3000:3000"
    volumes:
      - ./web:/app
      - /app/node_modules
    depends_on:
      - api

volumes:
  pgdata:
