# Production on the VPS, behind the host nginx (see README).
name: review-app

x-database-url: &database-url postgresql://${POSTGRES_USER:-review_user}:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}@postgres:5432/${POSTGRES_DB:-review_db}

services:
  postgres:
    image: postgres:18-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-review_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: ${POSTGRES_DB:-review_db}
    volumes:
      - pgdata:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $$POSTGRES_USER -d $$POSTGRES_DB"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  migrate:
    image: ghcr.io/vasobi14/revihub-migrate:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    environment:
      DATABASE_URL: *database-url
    depends_on:
      postgres:
        condition: service_healthy

  api:
    image: ghcr.io/vasobi14/revihub-api:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    env_file: .env
    # Values here override .env, so a dev NODE_ENV there cannot leak into prod
    environment:
      DATABASE_URL: *database-url
      NODE_ENV: production
    ports:
      - "127.0.0.1:3001:3001"
    volumes:
      - uploads:/app/uploads
    depends_on:
      migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  web:
    image: ghcr.io/vasobi14/revihub-web:${IMAGE_TAG:?Set IMAGE_TAG to a commit SHA}
    ports:
      - "127.0.0.1:3000:80"
    restart: unless-stopped

volumes:
  pgdata:
  uploads:
