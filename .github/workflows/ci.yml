name: CI/CD

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:
permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

jobs:
  api:
    name: API
    runs-on: ubuntu-latest
    timeout-minutes: 15

    defaults:
      run:
        working-directory: api

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: api/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Prisma generate
        run: npx prisma generate

      - name: TypeScript
        run: npx tsc --noEmit

      - name: Tests
        run: npm run test:run

  web:
    name: Web
    runs-on: ubuntu-latest
    timeout-minutes: 10

    defaults:
      run:
        working-directory: web

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

  # Build every image once per commit. Pull requests only check that the
  # Dockerfiles build; pushes to main publish the images tagged with the commit SHA.
  images:
    name: Image (${{ matrix.name }})
    needs: [api, web]
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    strategy:
      matrix:
        include:
          - { name: api, context: api, target: runtime }
          - { name: migrate, context: api, target: migrate }
          - { name: web, context: web, target: production }

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Setup Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        if: github.event_name == 'push'
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v7
        with:
          context: ${{ matrix.context }}
          target: ${{ matrix.target }}
          push: ${{ github.event_name == 'push' }}
          tags: ghcr.io/vasobi14/revihub-${{ matrix.name }}:${{ github.sha }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          cache-from: type=gha,scope=${{ matrix.name }}
          cache-to: type=gha,scope=${{ matrix.name }},mode=max

  deploy:
    name: Deploy
    needs: [images]
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: production
      url: https://vasobi.site

    steps:
      - name: SSH & deploy
        uses: appleboy/ssh-action@0ff4204d59e8e51228ff73bce53f80d53301dee2 # v1.2.5
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          fingerprint: ${{ secrets.VPS_HOST_FINGERPRINT }}
          command_timeout: 10m
          script: |
            set -e
            cd ~/review-app

            # Compose file of exactly the commit that passed the checks above
            git fetch origin main
            git checkout --force ${{ github.sha }}

            # Images built by the `images` job for this commit
            export IMAGE_TAG=${{ github.sha }}
            docker compose -f docker-compose.prod.yml pull

            # --wait blocks until healthchecks pass (API: GET /health)
            # On failure show only container status: app logs may contain user
            # data and Actions logs are public. Read them on the server instead.
            docker compose -f docker-compose.prod.yml up -d --wait --wait-timeout 120 || {
              docker compose -f docker-compose.prod.yml ps -a
              echo "Deploy failed. On the server run: docker compose -f docker-compose.prod.yml logs migrate api"
              exit 1
            }

            # Remove this project's images from previous deploys (matched by the
            # source label set in the `images` job; other images are left alone)
            docker image prune -af --filter "label=org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}"
